name: update api-docs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'config/crd/**'

concurrency:
  group: api-docs-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run-crdoc:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skiperator
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run crdoc Docker container
        run: |
          make apidocs

      - name: Commit directly to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: |
          cd skiperator
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api-docs.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update API docs [automated]"
            git push
          fi

      - name: Create Pull Request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: skiperator
          commit-message: "Update API docs"
          title: "Update generated API docs"
          body: |
            This PR updates the generated API documentation based on CRD changes.
            
            Triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}
          branch: update/api-docs
          labels: |
            documentation
            automated
          delete-branch: true
