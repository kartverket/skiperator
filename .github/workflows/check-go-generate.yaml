name: Check go generate

on:
    workflow_dispatch:
    pull_request:
      branches: [main]
      paths-ignore:
        - doc/**
        - samples/**
        - README.md
        - CONTRIBUTING.md
        - .github/workflows/api-docs.yaml
    push:
      branches: [main]
      paths-ignore:
        - doc/**
        - samples/**
        - README.md
        - CONTRIBUTING.md
        - .github/workflows/api-docs.yaml

jobs:
    check-go-generate:
        name: Check go generate
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                go-version-file: go.mod
                cache: true

            - name: Run make generate
              run: make generate

            - name: Check for changes
              run: |
                if ! git diff --quiet; then
                    echo "Error: 'make generate' produced changes. Please commit generated files."
                    git --no-pager diff
                    exit 1
                fi
