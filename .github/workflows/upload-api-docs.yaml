name: write api-docs to skip.kartverket.no

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api-docs.md'

concurrency:
  group: api-docs-upload
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update-docs:
    name: Update skiperator documentation in skip.kartverket.no
    uses: kartverket/github-workflows/.github/workflows/update-skip-docs.yaml@17f2ec02676e584a2d1a7c50e330f96395e2c351 # v5.1.1
    with:
      source_path: "api-docs.md"
      target_path: "docs/03-applikasjon-utrulling/03-skiperator/04-api-docs.md"
      branch_name: "update-skiperator-docs-branch"
      author_name: "GithubActions <skiperator@kartverket.no>"
      identity: "skiperator"
