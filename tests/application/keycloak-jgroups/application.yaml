apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: keycloak
spec:
  image: quay.io/keycloak/keycloak:26.8.1
  port: 8080
  replicas: 2
  stateful:
    enabled: true
  # Skiperator mounts a read-only root filesystem. The stock image must build
  # at start, so we copy it to /tmp (an emptyDir) first.
  command:
    - /bin/bash
    - -c
    - cp -r /opt/keycloak /tmp/keycloak && exec /tmp/keycloak/bin/kc.sh start
  additionalPorts:
    - name: management
      port: 9000
      protocol: TCP
    - name: tcp-jgroups
      port: 7800
      protocol: TCP
    - name: tcp-jgroups-fd
      port: 57800
      protocol: TCP
  env:
    - name: KC_DB
      value: dev-mem
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_CACHE_STACK
      value: kubernetes
    - name: KC_CACHE_EMBEDDED_MTLS_ENABLED
      value: "false"
    - name: JAVA_OPTS_APPEND
      value: -Djgroups.dns.query=keycloak-headless.keycloak-jgroups-ns.svc.cluster.local
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1Gi
  readiness:
    port: 9000
    path: /health/ready
    initialDelay: 10
  accessPolicy:
    inbound:
      rules:
        - application: keycloak
          ports:
            - port: 7800
              protocol: TCP
            - port: 57800
              protocol: TCP
    outbound:
      rules:
        - application: keycloak
          ports:
            - port: 7800
              protocol: TCP
            - port: 57800
              protocol: TCP
