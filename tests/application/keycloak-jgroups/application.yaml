apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: keycloak
spec:
  image: quay.io/keycloak/keycloak:26.8.1
  port: 8080
  replicas: 2
  stateful:
    enabled: true
  # Skiperator mounts a read-only root filesystem. The stock image must build
  # at start, so we copy it to /tmp (an emptyDir) first.
  command:
    - /bin/bash
    - -c
    - cp -r /opt/keycloak /tmp/keycloak && exec /tmp/keycloak/bin/kc.sh start
  additionalPorts:
    - name: management
      port: 9000
      protocol: TCP
    - name: tcp-jgroups
      port: 7800
      protocol: TCP
    - name: tcp-jgroups-fd
      port: 57800
      protocol: TCP
  env:
    - name: KC_DB
      value: dev-mem
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_PROXY_HEADERS
      value: xforwarded
    # The kubernetes stack is deprecated. The default stack, jdbc-ping, finds
    # the other pods through a shared database. KC_DB=dev-mem gives each pod
    # its own database, so this test uses the kubernetes stack instead. It finds
    # the other pods through DNS on the headless Service. Both stacks use the
    # same JGroups ports, 7800 and 57800.
    - name: KC_CACHE_STACK
      value: kubernetes
    - name: KC_CACHE_EMBEDDED_MTLS_ENABLED
      value: "false"
    - name: JAVA_OPTS_APPEND
      value: (join('', ['-Djgroups.dns.query=keycloak-headless.', $namespace, '.svc.cluster.local']))
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1Gi
  readiness:
    port: 9000
    path: /health/ready
    initialDelay: 10
  accessPolicy:
    inbound:
      rules:
        - application: keycloak
          ports:
            - port: 7800
              protocol: TCP
            - port: 57800
              protocol: TCP
    outbound:
      rules:
        - application: keycloak
          ports:
            - port: 7800
              protocol: TCP
            - port: 57800
              protocol: TCP
