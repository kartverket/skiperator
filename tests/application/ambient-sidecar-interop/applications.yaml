# Each namespace runs a web server and a client, so traffic goes both ways.
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: web
  namespace: interop-ambient-ns
spec:
  image: nginx/nginx-unprivileged:latest
  port: 8080
  accessPolicy:
    inbound:
      rules:
        - application: client
          namespace: interop-sidecar-ns
---
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: client
  namespace: interop-ambient-ns
spec:
  image: curlimages/curl:latest
  port: 8080
  command: ["sleep", "3600"]
  accessPolicy:
    outbound:
      rules:
        - application: web
          namespace: interop-sidecar-ns
          ports:
            - port: 8080
              protocol: TCP
---
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: web
  namespace: interop-sidecar-ns
spec:
  image: nginx/nginx-unprivileged:latest
  port: 8080
  accessPolicy:
    inbound:
      rules:
        - application: client
          namespace: interop-ambient-ns
---
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: client
  namespace: interop-sidecar-ns
spec:
  image: curlimages/curl:latest
  port: 8080
  command: ["sleep", "3600"]
  accessPolicy:
    outbound:
      rules:
        - application: web
          namespace: interop-ambient-ns
          ports:
            - port: 8080
              protocol: TCP
