apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: inbound-ports
spec:
  image: image
  port: 8080
  accessPolicy:
    inbound:
      rules:
        - application: inbound-ports-other
        - application: inbound-ports
          ports:
            - port: 57800
              protocol: TCP
            - port: 7800
              protocol: TCP
