apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: access-policy-cross-namespace
spec:
  skip: false
  concurrent: false
  skipDelete: false
  timeouts:
    apply: 30s
    assert: 30s
    cleanup: 30s
    delete: 30s
    error: 30s
    exec: 30s
  steps:
    - try:
        - apply:
            file: consumer.yaml
        - assert:
            file: consumer-not-ready.yaml
    - try:
        - apply:
            file: target.yaml
        - assert:
            file: consumer-ready.yaml
