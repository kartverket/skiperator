apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ambient
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespace: ambient-application
  steps:
    - try:
        - apply:
            file: namespace.yaml
        - create:
            file: application.yaml
        - assert:
            file: application-assert.yaml
    - try:
        - create:
            file: standard-routing.yaml
        - assert:
            file: standard-routing-assert.yaml
