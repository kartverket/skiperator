apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: access-policy-retry
spec:
  skip: false
  concurrent: false
  skipDelete: false
  steps:
    - try:
        - apply:
            file: first.yaml
        - assert:
            file: first-not-ready.yaml
    - try:
        - apply:
            file: second.yaml
        - assert:
            file: both-ready.yaml
    - try:
        - delete:
            ref:
              apiVersion: skiperator.kartverket.no/v1alpha1
              kind: Application
              name: second
        - assert:
            file: first-not-ready-after-delete.yaml
