apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: skipjob-access-policy-retry
spec:
  skip: false
  concurrent: false
  skipDelete: false
  steps:
    - try:
        - apply:
            file: skipjob.yaml
        - assert:
            file: skipjob-not-ready.yaml
    - try:
        - apply:
            file: target.yaml
        - assert:
            file: skipjob-ready.yaml
