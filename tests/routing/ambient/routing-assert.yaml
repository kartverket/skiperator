apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-backend-istio-ingress
  namespace: ambient-routing
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # Ambient routes the gateway's request to the target app through ztunnel, so
    # the HBONE port must be open next to the target port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-gateways
          podSelector:
            matchLabels:
              app: istio-ingress-external
      ports:
        - port: 8080
          protocol: TCP
        - port: 15008
          protocol: TCP
